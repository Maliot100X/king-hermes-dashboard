<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window frame -->
  <rect x="4" y="8" width="56" height="48" rx="4" fill="#201d1d" stroke="#fdfcfc" stroke-width="2"/>
  <!-- Window controls -->
  <circle cx="14" cy="18" r="3" fill="#ff3b30"/>
  <circle cx="24" cy="18" r="3" fill="#ff9f0a"/>
  <circle cx="34" cy="18" r="3" fill="#30d158"/>
  <!-- Code brackets representing OpenCode -->
  <text x="32" y="42" text-anchor="middle" font-family="Berkeley Mono, monospace" font-size="28" font-weight="bold" fill="#fdfcfc">&lt;/&gt;</text>
  <!-- Terminal prompt -->
  <text x="12" y="54" font-family="monospace" font-size="8" fill="#9a9898">$ opencode</text>
</svg>